<h2 mat-dialog-title>Modificar Asistencia</h2>
<mat-dialog-content>
  <div class="attendance-info">
    <p><strong>Estudiante:</strong> {{ data.studentName || data.record.studentId }}</p>
    <p><strong>DNI:</strong> {{ data.studentDni || '—' }}</p>
    <p><strong>Fecha:</strong> {{ data.currentDate | date:'fullDate' }}</p>
  </div>

  <form [formGroup]="form" class="attendance-form">
    <div class="radio-group">
      <mat-radio-group formControlName="status">
        <mat-radio-button value="presente">Presente</mat-radio-button>
        <mat-radio-button value="ausente">Ausente</mat-radio-button>
        <mat-radio-button value="tardanza">Tardanza</mat-radio-button>
        <mat-radio-button value="justificado">Justificado</mat-radio-button>
      </mat-radio-group>
    </div>

    <mat-form-field appearance="fill" class="full-width" *ngIf="form.get('status').value === 'justificado'">
      <mat-label>Razón</mat-label>
      <textarea matInput formControlName="reason" rows="3" placeholder="Motivo de la justificación..."></textarea>
      <mat-error *ngIf="form.get('reason').hasError('required')">La razón es obligatoria para justificaciones</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid || isSubmitting" (click)="onSubmit()">
    {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
  </button>
</mat-dialog-actions>

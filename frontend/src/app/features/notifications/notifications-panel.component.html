<h2 mat-dialog-title>
  <mat-icon>notifications</mat-icon>
  Notificaciones
  <span class="unread-count" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
</h2>

<mat-dialog-content class="panel-content">
  <div *ngIf="loading()" class="panel-loading">
    <mat-spinner diameter="28"></mat-spinner>
  </div>

  <div *ngIf="!loading() && notifications().length === 0" class="panel-empty">
    <mat-icon>notifications_none</mat-icon>
    <p>No tienes notificaciones</p>
  </div>

  <div class="notification-item" *ngFor="let notification of notifications()">
    <div class="notification-icon">
      <mat-icon>{{ iconFor(notification.type) }}</mat-icon>
    </div>
    <div class="notification-body">
      <span class="notification-title">{{ notification.title }}</span>
      <span class="notification-message" *ngIf="notification.message">
        {{ notification.message }}
      </span>
      <span class="notification-time">
        {{ notification.createdAt | date: 'dd/MM/yyyy HH:mm' }}
      </span>
    </div>
    <button
      type="button"
      class="read-btn"
      (click)="markRead(notification._id)"
      matTooltip="Marcar como leída"
      aria-label="Marcar como leída"
      *ngIf="!notification.read"
    >
      <mat-icon>done</mat-icon>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" *ngIf="unreadCount() > 0">
  <button mat-button (click)="markAllRead()">
    <mat-icon>done_all</mat-icon>
    Marcar todas como leídas
  </button>
</mat-dialog-actions>
